name: Bug report
description: Report something that is broken or behaving unexpectedly in liquibase-validation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve liquibase-validation. Please fill in as much detail as you can.

        If this is a security issue, do **not** open a public issue — see
        [SECURITY.md](https://github.com/eyupmiduck/liquibase_validation/blob/main/SECURITY.md)
        for private reporting.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and could not find this bug.
          required: true
  - type: input
    id: version
    attributes:
      label: liquibase-validation version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including the changelog layout where relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, JDK, and Maven version.
      placeholder: |
        OS: Ubuntu 24.04
        JDK: Temurin 25
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Stack trace or test output.
      render: shell
