# Keep Maven dependencies and GitHub Actions current.
#
# Minor and patch updates are grouped into a single PR per ecosystem to reduce
# noise; major updates arrive as individual PRs so they get a real review.
# The auto-merge workflow only queues the grouped minor/patch PRs, so a major
# update always needs a manual merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
