name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The workflow only reads the repository; the Codecov step is advisory.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify the coverage report exists
        # A missing report means the coverage configuration broke; fail here so
        # it is not hidden by the advisory Codecov upload below.
        run: test -s target/site/jacoco/jacoco.xml

      - name: Upload coverage to Codecov
        # Advisory: a Codecov outage or an unlinked repository must not fail CI.
        # `continue-on-error` is the single suppression; the action's own
        # fail_ci_if_error defaults to false and is intentionally not set twice.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/site/jacoco/jacoco.xml
