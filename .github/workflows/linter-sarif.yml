name: Linter SARIF

# Demonstrates the changelog linter's SARIF output reaching GitHub code
# scanning: it lints a sample changelog, always uploads the SARIF document, and
# then fails on a finding. Code scanning shows the finding inline on the pull
# request; the failing step surfaces it in the checks list. See the README's
# "Code scanning" section.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linter-sarif-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The CLI jar is built by the package phase (shade, classifier cli).
      - name: Package the linter CLI
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Lint the sample changelog (SARIF)
        # The findings are reported by the upload below, so a non-zero exit here
        # is expected; the final step is what fails the job. `|| true` keeps the
        # SARIF file for the upload.
        run: |
          java -jar target/liquibase-validation-*-cli.jar \
            --changelog-root src/test/resources/sarif \
            --master src/test/resources/sarif/sample-changelog.xml \
            --config src/test/resources/sarif/sample-changelog-linter.yml \
            --reporter sarif \
            --fail-on none \
            > linter.sarif || true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: linter.sarif

      - name: Fail on linter findings
        run: |
          java -jar target/liquibase-validation-*-cli.jar \
            --changelog-root src/test/resources/sarif \
            --master src/test/resources/sarif/sample-changelog.xml \
            --config src/test/resources/sarif/sample-changelog-linter.yml \
            --reporter tty \
            --fail-on warning
