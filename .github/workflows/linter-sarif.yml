name: Linter SARIF

# Demonstrates the changelog linter's SARIF output reaching GitHub code
# scanning: it lints a sample changelog and uploads the SARIF document, so the
# finding shows inline on the pull request. The sample deliberately contains a
# finding, so the failing step is expected and advisory
# (`continue-on-error`); the upload is the point of this workflow, the real
# gate is `./mvnw verify` in the Build workflow. See the README's "Code
# scanning" section.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linter-sarif-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The CLI jar is built by the package phase (shade, classifier cli).
      - name: Package the linter CLI
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Lint the sample changelog (SARIF)
        # The findings are reported by the upload; `--fail-on none` keeps the
        # SARIF file for it and a clean exit.
        run: |
          java -jar target/liquibase-validation-*-cli.jar \
            --changelog-root src/test/resources/sarif \
            --master src/test/resources/sarif/sample-changelog.xml \
            --config src/test/resources/sarif/sample-changelog-linter.yml \
            --reporter sarif \
            --fail-on none \
            > linter.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: linter.sarif

      # Shows how a finding fails a run without turning this demonstration into
      # a blocking check on every pull request.
      - name: Fail on linter findings
        continue-on-error: true
        run: |
          java -jar target/liquibase-validation-*-cli.jar \
            --changelog-root src/test/resources/sarif \
            --master src/test/resources/sarif/sample-changelog.xml \
            --config src/test/resources/sarif/sample-changelog-linter.yml \
            --reporter tty \
            --fail-on warning
