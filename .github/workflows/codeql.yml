name: CodeQL

# Static analysis for Java. Runs on every pull request and change to main, and
# on a weekly schedule so newly added CodeQL queries are applied to unchanged
# code.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "27 3 * * 1"

# Superseded runs on the same ref and event are useless once a newer run starts.
# The event name is part of the group so a push to main cannot cancel the
# scheduled scan, whose purpose is applying new queries to unchanged code.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java 25 must be available before CodeQL autobuild runs.
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java-kotlin
          build-mode: autobuild

      - name: Analyze
        # Fork pull requests get a read-only token, so the SARIF upload cannot
        # succeed. Keep the analysis result green there; same-repo PRs, pushes
        # and scheduled runs still publish results.
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:java-kotlin"
