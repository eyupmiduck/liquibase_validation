name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded pull-request scans, but let main-branch scans finish so no
# merged commit is left unscanned.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    # Pinned to a commit so an upstream change to the reusable workflow cannot
    # alter what runs here without a review on this side. Bump deliberately.
    uses: eyupmiduck/workflow_library/.github/workflows/secret-scan.yml@7fa94c847818d1d45df7132d6cc3857bf6162f61 # main
