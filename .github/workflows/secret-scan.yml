name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded pull-request scans, but let main-branch scans finish so no
# merged commit is left unscanned.
concurrency:
  # A push to main gets its own group per commit, so an older pending commit is
  # never dropped by GitHub's one-running/one-pending concurrency limit.
  group: secret-scan-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    # Pinned to a commit so an upstream change to the reusable workflow cannot
    # alter what runs here without a review on this side. Bump deliberately.
    uses: eyupmiduck/workflow_library/.github/workflows/secret-scan.yml@7fa94c847818d1d45df7132d6cc3857bf6162f61 # main
