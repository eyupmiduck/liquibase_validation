name: Publish

on:
  push:
    tags:
      - "v*"

# Release artifacts are immutable: never cancel an in-flight publish, and queue
# overlapping runs for the same tag rather than racing them.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Release artifacts are immutable, so the tag must name the version in
      # pom.xml (e.g. tag v0.1.0 for version 0.1.0).
      - name: Verify tag matches project version
        run: |
          raw="$(./mvnw --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.version -q -DforceStdout || true)"
          # help:evaluate can emit extra lines (e.g. bootstrap output); take the
          # last non-blank one and strip whitespace.
          version="$(printf '%s\n' "${raw}" | sed -n '/[^[:space:]]/p' | tail -n 1 | tr -d '[:space:]')"
          if [ -z "${version}" ]; then
            echo "Could not determine project.version from the Maven output" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}" >&2
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: ./mvnw --batch-mode --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
