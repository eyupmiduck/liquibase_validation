name: Publish

on:
  push:
    tags:
      - "v*"

# Release artifacts are immutable: never cancel an in-flight publish, and queue
# overlapping runs for the same tag rather than racing them.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Route the irreversible deploy through a protected environment so a
    # mistyped tag cannot publish without the required reviewers configured on
    # that environment.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Release artifacts are immutable, so the tag must name the version in
      # pom.xml (e.g. tag v0.1.0 for version 0.1.0).
      - name: Verify tag matches project version
        run: |
          # Do not swallow a Maven failure: a failure here is a broken release
          # toolchain, not an unknown version.
          raw="$(./mvnw --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.version -q -DforceStdout)"
          # help:evaluate can emit extra lines (e.g. bootstrap output); select a
          # line that looks like a version rather than blindly taking the last.
          version="$(printf '%s\n' "${raw}" | sed -nE 's/^[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*)[[:space:]]*$/\1/p' | tail -n 1)"
          if [ -z "${version}" ]; then
            echo "Could not determine project.version from the Maven output: ${raw}" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}" >&2
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: ./mvnw --batch-mode --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
