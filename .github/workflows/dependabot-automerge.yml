name: Dependabot auto-merge

# Dependabot PRs are queued for auto-merge once the required checks on main
# pass, so a green PR lands without a manual merge and a failing one stays
# open. The shared workflow only queues minor and patch updates (grouped by
# dependabot.yml); major updates stay for a human to merge.
#
# `pull_request_target` gives the run a read/write GITHUB_TOKEN, which
# Dependabot's `pull_request` runs lack. The shared workflow never checks out
# or executes the pull request's code.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Defense in depth: the shared workflow also checks the actor/update type,
    # but only Dependabot PRs targeting main should reach a write-capable run.
    # The pin was audited as a reusable workflow that never checks out PR code.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    concurrency:
      group: dependabot-automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: eyupmiduck/workflow_library/.github/workflows/dependabot-automerge.yml@2499e14a4533396c8318abecaa35dd2477be1f41 # main
